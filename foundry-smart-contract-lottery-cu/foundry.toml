[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/',
  '@solmate=lib/solmate/src/'
]

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]

[fuzz]
runs = 256

fs_permissions = [
  { access = "read", path = "./broadcast" },
  { access = "read", path = "./reports" }
]