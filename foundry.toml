[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
      "@chainlink-brownie-contracts/=lib/chainlink-brownie-contracts/contracts/"
]

ffi = true

fs_permissions = [
    { access = "read", path = "./img/" }
]